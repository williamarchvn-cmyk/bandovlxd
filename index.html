async function geocodeAddr(addr, name) {
  const tries = Core.addrTries(addr, name);
  for (const [q0, level] of tries) {
    const q = /vi[eệ]t\s*nam/i.test(q0) ? q0 : q0 + ', Việt Nam';
    let hit;
    if (geoCache.has(q)) hit = geoCache.get(q);
    else {
      const wait = 1100 - (Date.now() - lastGeo); if (wait > 0) await sleep(wait);
      lastGeo = Date.now();
      const r = await fetchJSON(NOMINATIM + '?format=jsonv2&limit=1&countrycodes=vn&accept-language=vi&q=' + encodeURIComponent(q), 12000);
      hit = Array.isArray(r) && r[0] ? { lat: +r[0].lat, lng: +r[0].lon, rank: +r[0].place_rank || 0 } : null;
      geoCache.set(q, hit);
    }
    if (hit) return { ...hit, rank: level === 'area' ? Math.min(hit.rank, 25) : level === 'street' ? Math.min(hit.rank, 27) : hit.rank };
  }
  return null;
}
// Nhiều cửa hàng tìm ra cùng 1 điểm (VD tâm "Dĩ An", hoặc đường chưa có số nhà) → xòe ra quanh điểm đó để kéo được từng ghim
function impSpread(imp, r) {
  const same = imp.rows.filter(x => x !== r && x.lat != null && x.baseLat != null && Math.abs(x.baseLat - r.lat) < 1e-6 && Math.abs(x.baseLng - r.lng) < 1e-6).length;

  const ang = same * 2.39996, rad = 0.0006 * Math.sqrt(same);   // xoắn ốc, ~65m mỗi vòng
  r.lat = Math.round((r.lat + rad * Math.sin(ang)) * 1e7) / 1e7;
  r.lng = Math.round((r.lng + rad * Math.cos(ang)) * 1e7) / 1e7;
}
async function runGeocode(imp) {
  if (imp.running) return;

  const todo = imp.rows.filter(r => r.st === 'pending' && r.sel);
  let netErr = 0;
  imp.prog = { done: 0, total: todo.length, t0: Date.now() };
  renderImpProgress(); renderImpSummary();
  for (let k = 0; k < todo.length; k++) {
    if (imp.stop || !S.editing || S.editing.draft !== imp) break;
    const r = todo[k];
    try {
      const g = await geocodeAddr(r.address, r.name);
      netErr = 0;
      if (g) {
        r.lat = Math.round(g.lat * 1e7) / 1e7; r.lng = Math.round(g.lng * 1e7) / 1e7;
        r.st = g.rank >= 28 ? 'geo' : 'approx';
        r.note = g.rank >= 28 ? '' : g.rank >= 26 ? 'chỉ tìm được tới tên đường' : 'chỉ tìm được tới phường / thị xã';
        impSpread(imp, r);
        impCheckDup(r);
      }
      else { r.st = 'none'; r.note = (r.note ? r.note + ' · ' : '') + 'Không tìm được địa chỉ'; }
    } catch (e) {
      r.st = 'pending'; r.note = 'Lỗi mạng — sẽ thử lại khi bấm "Tìm tiếp"';
      if (++netErr >= 3) { toast('Không kết nối được dịch vụ tìm địa chỉ — đã dừng. Kiểm tra internet rồi bấm "Tìm tiếp".', 'err'); break; }
    }
    if (!S.editing || S.editing.draft !== imp) break;
    imp.prog.done = k + 1;
    updateImpRow(imp, r); syncImpMarker(imp, r); renderImpProgress(); renderImpSummary();
  }
  imp.running = false;
  if (S.editing && S.editing.draft === imp) { renderImpProgress(); renderImpSummary(); fitImport(imp); }
}

/* ---------- Ghim nhập trên bản đồ ---------- */
function impIcon(r) {

function syncImpMarker(imp, r) {

function syncImpMarkers() { const imp = S.editing.draft; imp.rows.forEach(r => syncImpMarker(imp, r)); }
function fitImport(imp) {

}
async function saveImport(btn) {
  const imp = S.editing.draft;
  if (imp.running) { toast('Đang tìm vị trí — đợi xong hoặc bấm "Dừng"', 'warn'); return; }
  const sel = imp.rows.filter(r => r.sel), ready = sel.filter(r => r.lat != null);
  if (!ready.length) { toast('Chưa có cửa hàng nào được chọn và có vị trí', 'warn'); return; }
  const miss = sel.length - ready.length;

  btn.disabled = true;

    for (let i = 0; i < ready.length; i += 200) {

      const { error } = await sb.from('stores').insert(chunk.map(r => ({ name: r.name, phone: r.phone, address: r.address, lat: r.lat, lng: r.lng })));
      if (error) throw error;
      saved += chunk.length;
      chunk.forEach(r => { r.sel = false; r.saved = true; });
    }
    toast('Đã thêm ' + saved + ' cửa hàng lên bản đồ — mở từng cửa hàng để nhập bảng giá', 'ok');

    await loadData(true);

  } catch (err) {

    if (saved) { toast('Đã lưu ' + saved + '/' + ready.length + ' cửa hàng rồi gặp lỗi: ' + er.msg + ' — bấm Lưu để thử tiếp phần còn lại', 'err'); renderImpList(); syncImpMarkers(); renderImpSummary(); }
    else handleWriteErr(er);
    btn.disabled = false; renderImpSummary();
  }

/* ================= Nhập bảng giá sản phẩm (quản lý) ================= */
// 3 kiểu bảng: "long" = mỗi dòng 1 giá (có cột Cửa hàng) · "wide" = mỗi cột là 1 cửa hàng · "single" = 1 cửa hàng
const PI_PATS = {
  sphone: /(sdt|so dt|dien thoai|phone|tel)/,
  store: /(cua hang|store|dai ly|shop|nha cung cap|ncc)/,
  unit: /(don vi|dvt|^dv$|unit)/,
  grp: /(nhom|loai|danh muc|category|group)/,
  spec: /(quy cach|spec)/,
  name: /(san pham|mat hang|hang hoa|vat tu|vat lieu|ten hang|ten sp|product|item|^ten$|^ten )/,
  price: /(gia|price)/
};
// Tìm cửa hàng theo SĐT, tên trùng khớp, hoặc tên cửa hàng nằm trong nhãn (VD cột "Giá VLXD An Phú")
function matchStore(label, phone) {
  const ph = String(phone || '').replace(/\D/g, '');
  if (ph.length >= 9) { const s = S.stores.find(x => x.phone.replace(/\D/g, '') === ph); if (s) return s; }
  const f = Core.fold(Core.clean(label)); if (!f) return null;
  const exact = S.stores.filter(x => Core.fold(Core.clean(x.name)) === f);
  if (exact.length === 1) return exact[0];
  if (exact.length > 1) return null;
  const inLabel = S.stores.filter(x => { const n = Core.fold(Core.clean(x.name)); return n.length >= 4 && f.includes(n); })
    .sort((a, b) => b.name.length - a.name.length);
  if (inLabel.length) return inLabel[0];
  const inName = f.length >= 5 ? S.stores.filter(x => Core.fold(Core.clean(x.name)).includes(f)) : [];
  return inName.length === 1 ? inName[0] : null;
}
const storeOpts = sel => S.stores.slice().sort((a, b) => a.name.localeCompare(b.name, 'vi'))
  .map(x => '<option value="' + esc(x.id) + '"' + (x.id === sel ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');
const piHead = P => (P.hasHead ? P.raw[0] : null);
const piData = P => (P.hasHead ? P.raw.slice(1) : P.raw);

function openPriceImport(storeId) {
  const P = { step: 1, raw: [], hasHead: false, fname: '', paste: '', layout: 'long', cols: null, wmap: {}, storeId: storeId || '',
    replace: false, entries: [], errors: [], empty: 0, prods: [], smaps: [], filter: 'all', returnTo: storeId || null };
  S.editing = { type: 'pimport', id: null, draft: P, dirty: false };
  renderPImport();
}
function piIsHeader(row) {
  if (!row || !row.length) return false;
  const hits = row.filter(h => h && (Object.values(PI_PATS).some(p => p.test(Core.headKey(h))) || matchStore(h))).length;
  const nums = row.filter(h => /^[\d\s.,]+\s*(k|đ|d|vnđ|vnd)?$/i.test(String(h || '').trim()) && Core.parseVND(h) > 0).length;
  return hits > 0 && nums === 0;
}
function piGuess(P) {
  const head = piHead(P), data = piData(P), sample = data.slice(0, 40);
  const ncol = Math.max(0, ...P.raw.map(r => r.length));
  const c = { store: -1, sphone: -1, name: -1, unit: -1, price: -1, grp: -1, spec: -1 }, used = new Set();
  const filled = j => sample.map(r => r[j]).filter(x => x != null && String(x).trim() !== '');
  const priceRatio = j => { const v = filled(j); return v.length ? v.filter(x => Core.parseVND(x) > 0).length / v.length : 0; };
  P.wmap = {};
  if (head) head.forEach((h, j) => { const st = h && matchStore(h); if (st && priceRatio(j) >= 0.5) { P.wmap[j] = st.id; used.add(j); } });
  if (head) for (const k of ['sphone', 'store', 'unit', 'grp', 'spec', 'name', 'price']) {
    const i = head.findIndex((h, j) => !used.has(j) && h && PI_PATS[k].test(Core.headKey(h)));
    if (i >= 0) { c[k] = i; used.add(i); }
  }
  const isUnit = x => !!Core.UNIT_ALIAS[Core.fold(x).replace(/[\s.]/g, '')] || S.cat.some(k => Core.fold(k.unit) === Core.fold(Core.clean(x)));
  if (c.unit < 0) for (let j = 0; j < ncol; j++) {
    if (used.has(j)) continue;
    const v = filled(j); if (v.length && v.filter(isUnit).length / v.length > 0.6) { c.unit = j; used.add(j); break; }
  }
  if (c.price < 0 && !Object.keys(P.wmap).length) for (let j = ncol - 1; j >= 0; j--) {
    if (!used.has(j) && priceRatio(j) > 0.6) { c.price = j; used.add(j); break; }
  }
  for (let j = 0; j < ncol && c.name < 0; j++) {
    if (used.has(j)) continue;
    const v = filled(j); if (!v.length) continue;
    if (v.filter(x => /[a-zà-ỹđ]/i.test(x) && !(Core.parseVND(x) > 0)).length / v.length <= 0.6) continue;
    if (c.store < 0 && v.filter(x => matchStore(x)).length / v.length > 0.6) { c.store = j; used.add(j); continue; }
    c.name = j; used.add(j);
  }
  P.cols = c;
  P.layout = Object.keys(P.wmap).length && c.store < 0 ? 'wide' : c.store >= 0 ? 'long' : 'single';
  if (P.layout === 'single' && !P.storeId && S.stores.length === 1) P.storeId = S.stores[0].id;
}
function piStartMapping(P, rows) {
  if (!rows.length) { toast('Không thấy dữ liệu trong bảng', 'warn'); return; }
  if (rows.length > 20001) { toast('Bảng quá dài — mỗi lần nhập tối đa 20.000 dòng', 'warn'); return; }
  P.raw = rows; P.hasHead = piIsHeader(rows[0]);
  piGuess(P);
  P.step = 2; S.editing.dirty = true;
  renderPImport();
}

/* ---------- Đọc các dòng giá theo kiểu bảng đã chọn ---------- */
function piBuild(P) {
  const c = P.cols, off = P.hasHead ? 2 : 1, E = [], errs = [];
  let empty = 0;
  const targetsOf = r => {
    if (P.layout === 'wide') return Object.entries(P.wmap).filter(([, sid]) => sid).map(([j, sid]) => ({ storeId: sid, raw: r[+j] }));
    if (P.layout === 'long') return [{ label: Core.clean(c.store >= 0 ? r[c.store] : ''), phone: c.sphone >= 0 ? String(r[c.sphone] || '') : '', raw: c.price >= 0 ? r[c.price] : '' }];
    return [{ storeId: P.storeId, raw: c.price >= 0 ? r[c.price] : '' }];
  };
  piData(P).forEach((r, i) => {
    const line = i + off, name = Core.clean(c.name >= 0 ? r[c.name] : '');
    if (!name) { if (r.some(x => String(x || '').trim())) errs.push({ line, msg: 'thiếu tên sản phẩm' }); return; }
    const unit = c.unit >= 0 ? Core.normUnit(r[c.unit]) : '';
    for (const tg of targetsOf(r)) {
      const v = Core.parseVND(tg.raw);
      if (v == null) { if (P.layout !== 'wide') empty++; continue; }
      if (!(v > 0)) { errs.push({ line, msg: '"' + name + '": giá "' + String(tg.raw).trim() + '" không đọc được' }); continue; }
      if (P.layout === 'long' && !tg.label && !tg.phone.trim()) { errs.push({ line, msg: '"' + name + '": thiếu tên cửa hàng' }); continue; }
      E.push({ line, name, unit, grp: Core.clean(c.grp >= 0 ? r[c.grp] : ''), spec: Core.clean(c.spec >= 0 ? r[c.spec] : ''), price: v,
        pkey: Core.prodKey(name, unit), label: tg.label || '', phone: tg.phone || '', storeId: tg.storeId || '',
        skey: P.layout === 'long' ? Core.fold(tg.label) + '|' + tg.phone.replace(/\D/g, '') : '' });
    }
  });
  P.entries = E; P.errors = errs; P.empty = empty;
}
// Khớp sản phẩm với danh mục, cửa hàng với bản đồ (giữ lựa chọn tay của người dùng)
function piResolve(P) {
  const km = new Map(S.cat.map(c => [Core.prodKey(c.name, c.unit), c]));
  const oldP = new Map((P.prods || []).map(p => [p.pkey, p])), prods = new Map();
  for (const e of P.entries) {
    if (prods.has(e.pkey)) { prods.get(e.pkey).n++; continue; }
    let hit = km.get(e.pkey) || null, unit = e.unit;
    if (!hit && !unit) { const same = S.cat.filter(c => Core.fold(Core.clean(c.name)) === Core.fold(e.name)); if (same.length === 1) { hit = same[0]; unit = hit.unit; } }
    const p = { pkey: e.pkey, name: e.name, unit, grp: e.grp || (hit ? hit.grp : ''), spec: e.spec, auto: hit ? hit.id : (unit ? '__new' : '__bad'), n: 1 };
    const o = oldP.get(e.pkey);
    p.userSet = !!(o && o.userSet);
    p.act = p.userSet ? o.act : (p.auto === '__bad' ? '__skip' : p.auto);
    if (p.act !== '__new' && p.act !== '__skip' && !S.catById.has(p.act)) { p.act = p.auto === '__bad' ? '__skip' : p.auto; p.userSet = false; }
    prods.set(e.pkey, p);
  }
  P.prods = [...prods.values()];
  P.smaps = [];
  if (P.layout === 'long') {
    const oldS = new Map((P.smapsOld || []).map(x => [x.skey, x])), sm = new Map();
    for (const e of P.entries) {
      if (sm.has(e.skey)) { sm.get(e.skey).n++; continue; }
      const st = matchStore(e.label, e.phone), o = oldS.get(e.skey);
      sm.set(e.skey, { skey: e.skey, label: e.label, phone: e.phone, auto: st ? st.id : '', sel: o && o.userSet ? o.sel : (st ? st.id : ''), userSet: !!(o && o.userSet), n: 1 });

function piPlan(P) {

    if (g.has(k)) dup++;

    const del = P.replace ? [...cur.keys()].filter(k => !g.has(k)).length : 0;
    stores.push({ st, g, add, chg, same, del });

async function piSave(btn) {
  const P = S.editing.draft, plan = piPlan(P);
  if (!plan.stores.length) { toast('Chưa có cửa hàng nào nhận được giá — kiểm tra phần Cửa hàng', 'warn'); return; }
  const delN = plan.stores.reduce((a, x) => a + x.del, 0);
  if (delN && !confirm('Sẽ XÓA ' + delN + ' món cũ (không có trong file) khỏi bảng giá của ' + plan.stores.filter(x => x.del).length + ' cửa hàng. Tiếp tục?')) return;
  btn.disabled = true;
  const idOf = new Map();
  if (plan.newProds.length) {
    btn.textContent = 'Đang thêm ' + plan.newProds.length + ' món vào danh mục…';
    try {
      const next = new Map();
      const rows = plan.newProds.map(p => {
        const g = Core.clean(p.grp) || 'Khác', s0 = next.has(g) ? next.get(g) : nextSort(g);
        next.set(g, s0 + 1);
        return { grp: g, name: Core.clean(p.name).slice(0, 120), unit: Core.clean(p.unit), spec: Core.clean(p.spec), sort: s0 };
      });
      const { data, error } = await sb.from('catalog').insert(rows).select(CAT_COLS);
      if (error) throw error;
      (data || []).forEach(c => idOf.set(Core.prodKey(c.name, c.unit), c.id));
    } catch (err) {
      const er = dbErr(err);
      if (er.kind === 'dup') {
        toast('Danh mục vừa có thêm món trùng tên — đã tải lại, kiểm tra rồi bấm Lưu lần nữa', 'warn');
        await loadData(true); piBuild(P); piResolve(P); piRefresh(P);
      } else { handleWriteErr(er); piRefresh(P); }
      return;
    }
  }
  const order = new Map(Core.sortCat(S.cat, S.grpRank).map((c, i) => [c.id, i]));
  let done = 0, add = 0, chg = 0;
  try {
    for (const x of plan.stores) {
      btn.textContent = 'Đang lưu giá cửa hàng ' + (done + 1) + '/' + plan.stores.length + '…';
      const base = P.replace ? new Map() : new Map(x.st.products.map(p => [p.cid, p.price]));
      for (const [k, v] of x.g) { const cid = k.startsWith('new:') ? idOf.get(k.slice(4)) : k; if (cid) base.set(cid, v); }
      const products = [...base].sort((a, b) => (order.has(a[0]) ? order.get(a[0]) : 1e9) - (order.has(b[0]) ? order.get(b[0]) : 1e9))
        .map(([cid, price]) => ({ catalog_id: cid, price }));
      const { error } = await sb.rpc('save_store', { p: { id: x.st.id, name: x.st.name, phone: x.st.phone, address: x.st.address, lat: x.st.lat, lng: x.st.lng, products } });
      if (error) throw error;
      done++; add += x.add; chg += x.chg;
    }
  } catch (err) {
    const er = dbErr(err);
    if (er.kind === 'auth') { handleWriteErr(er); return; }
    toast('Đã lưu ' + done + '/' + plan.stores.length + ' cửa hàng rồi gặp lỗi: ' + er.msg + ' — bấm Lưu để thử tiếp', 'err');
    await loadData(true); piBuild(P); piResolve(P); piRefresh(P);
    return;
  }
  toast('Đã cập nhật giá cho ' + done + ' cửa hàng: ' + add + ' món mới, ' + chg + ' món đổi giá' + (plan.newProds.length ? ' · thêm ' + plan.newProds.length + ' món vào danh mục' : ''), 'ok');
  const back = P.returnTo;
  closeForm(true);
  await loadData(true);
  if (back && S.stores.some(x => x.id === back)) openStoreForm(back);
}

/* ================= Gợi ý ================= */
let suggestToken = 0;
async function osrmTable(o, stores) {
  const out = new Array(stores.length).fill(null);
  const CH = 80; let anyOk = false;
  for (let i = 0; i < stores.length; i += CH) {
    const part = stores.slice(i, i + CH);
    const coords = [o.lng + ',' + o.lat].concat(part.map(s => s.lng + ',' + s.lat)).join(';');
    try {
      const r = await fetchJSON(OSRM + '/table/v1/driving/' + coords + '?sources=0&annotations=distance,duration', 15000);
      if (!r || r.code !== 'Ok') throw new Error(r && r.code);
      part.forEach((s, j) => {
        const dm = r.distances && r.distances[0] ? r.distances[0][j + 1] : null;
        const du = r.durations && r.durations[0] ? r.durations[0][j + 1] : null;
        if (dm != null) { out[i + j] = { distance: dm, duration: du }; anyOk = true; }
      });
    } catch (e) { /* phần này sẽ dùng chim bay */ }
  }
  return { out, anyOk };
}

async function runSuggest(d, root, btn) {
  if (d.lat == null) { toast('Cần đặt vị trí trước khi gợi ý', 'warn'); return; }
  const cc = collectCart(d, false);
  if (cc.error) { toast(cc.error, 'warn'); return; }
  const cart = Core.normalizeCart(cc.items);
  if (!cart.length) { toast('Giỏ hàng đang trống — hãy chọn sản phẩm và số lượng', 'warn'); return; }
  const box = root.querySelector('.suggest-box');
  if (!S.stores.length) { box.innerHTML = '<div class="alert">Chưa có cửa hàng nào trên hệ thống.</div>'; return; }
  const tok = ++suggestToken;
  box.innerHTML = '<div class="loading">⏳ Đang tính khoảng cách tới ' + S.stores.length + ' cửa hàng…</div>';
  btn.disabled = true;
  const origin = { lat: d.lat, lng: d.lng };
  const rows = Core.evaluate(S.stores, cart);
  let res = { out: [], anyOk: false };
  try { res = await osrmTable(origin, S.stores); } catch (e) { /* bỏ qua */ }
  btn.disabled = false;
  if (tok !== suggestToken) return;
  let approxCount = 0;
  rows.forEach((r, i) => {
    const o = res.out[i];
    if (o) { r.distance = o.distance; r.duration = o.duration; }
    else { r.distance = Core.haversine(origin, r.store); r.duration = null; r.approx = true; approxCount++; }
  });
  const picked = Core.pick(rows);
  d.result = { cart, origin, method: res.anyOk ? 'osrm' : 'haversine', approxCount, ...picked };
  renderResult(box, d.result);
  if (box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
  drawRoutes(d.result, tok);
}

function rowDist(r) {
  return r.approx ? '≈ ' + Core.dist(r.distance) + ' (chim bay)' : Core.dist(r.distance) + (r.duration != null ? ' · ' + Core.dur(r.duration) : '');
}
function missText(r) { return r.missing.map(m => m.name + ' (' + m.unit + ')').join(', '); }

function renderResult(box, R) {
  const n = R.nearest, c = R.cheapest;
  let h = '';
  if (R.method === 'osrm') {
    h += '<div class="method ok">🛣️ Khoảng cách theo <b>đường đi thực tế</b> (OSRM)' +
      (R.approxCount ? ' — ' + R.approxCount + ' cửa hàng không tìm được đường, tạm dùng đường chim bay.' : '.') + '</div>';
  } else {
    h += '<div class="method warn">⚠️ Không gọi được OSRM — đang dùng <b>đường chim bay (Haversine)</b>, khoảng cách chỉ gần đúng.</div>';
  }
  const same = n && c && n.store.id === c.store.id;
  h += '<div class="hl-grid">';
  if (same) {
    h += '<button type="button" class="hl both" data-store="' + esc(n.store.id) + '"><span class="hl-label"><span class="lb-near">📍 Gần nhất</span> · <span class="lb-cheap">💰 Rẻ nhất (cả giỏ hàng)</span></span>' +
      '<b>' + esc(n.store.name) + '</b><span class="small">' + rowDist(n) + '</span><span class="total">' + money(n.total) + '</span></button>';
  } else if (n) {
    h += '<button type="button" class="hl near" data-store="' + esc(n.store.id) + '"><span class="hl-label">📍 Gần nhất</span>' +
      '<b>' + esc(n.store.name) + '</b><span class="small">' + rowDist(n) + '</span>' +
      '<span class="total">' + money(n.total) + (n.full ? '' : '<span class="small muted"> (chưa đủ)</span>') + '</span>' +
      (n.full ? '' : '<span class="missing">Thiếu: ' + esc(missText(n)) + '</span>') + '</button>';
  }
  if (same) { /* đã gộp chung 1 thẻ */ } else if (c) {
    h += '<button type="button" class="hl cheap" data-store="' + esc(c.store.id) + '"><span class="hl-label">💰 Rẻ nhất (cả giỏ hàng)</span>' +
      '<b>' + esc(c.store.name) + '</b><span class="small">' + rowDist(c) + '</span>' +
      '<span class="total">' + money(c.total) + '</span></button>';
  } else {
    h += '<div class="hl none"><span class="hl-label">💰 Rẻ nhất (cả giỏ hàng)</span><span class="small">Không có cửa hàng nào bán đủ cả giỏ hàng.</span></div>';
  }
  h += '</div>';
  if (!c) {
    const sold = new Set();
    S.stores.forEach(s => s.products.forEach(p => sold.add(p.cid)));
    const nowhere = R.cart.filter(i => !sold.has(i.key));
    h += '<div class="alert"><b>Không cửa hàng nào bán đủ mọi món.</b> ' +
      (nowhere.length ? 'Không nơi nào bán: ' + esc(nowhere.map(i => i.name + ' (' + i.unit + ')').join(', ')) + '.'
        : 'Món nào cũng có nơi bán, nhưng mỗi cửa hàng đều thiếu ít nhất 1 món — xem chi tiết bên dưới.') + '</div>';
  }
  h += '<div class="route-legend"><span><i style="background:#2563eb"></i>tới gần nhất</span><span><i style="background:#16a34a"></i>tới rẻ nhất</span><span><i style="background:repeating-linear-gradient(90deg,#64748b 0 5px,transparent 5px 9px)"></i>đường thẳng (không lấy được tuyến)</span></div>';
  h += '<h4 class="rank-title">Xếp hạng tất cả cửa hàng (' + R.ranking.length + ')</h4><ol class="rank">';
  R.ranking.forEach((r, i) => {
    const isN = n && n.store.id === r.store.id, isC = c && c.store.id === r.store.id;
    h += '<li><button type="button" class="rank-row' + (r.full ? '' : ' partial') + '" data-store="' + esc(r.store.id) + '">' +
      '<span class="rk">' + (i + 1) + '</span><span class="rk-main"><span><b>' + esc(r.store.name) + '</b>' +
      (isN ? '<span class="badge near">gần nhất</span>' : '') + (isC ? '<span class="badge cheap">rẻ nhất</span>' : '') + '</span>' +
      '<span class="muted small">' + rowDist(r) + '</span>' +
      (r.full ? '' : '<span class="missing">Thiếu: ' + esc(missText(r)) + '</span>') + '</span>' +
      '<span class="rk-total">' + money(r.total) + (r.full ? '' : '<small>chưa đủ hàng</small>') + '</span></button></li>';
  });
  h += '</ol>';
  box.innerHTML = h;
}

async function routeTo(o, s, color) {
  try {
    const r = await fetchJSON(OSRM + '/route/v1/driving/' + o.lng + ',' + o.lat + ';' + s.lng + ',' + s.lat + '?overview=full&geometries=geojson', 12000);
    if (!r || r.code !== 'Ok' || !r.routes || !r.routes.length) throw new Error('no route');
    return { coords: r.routes[0].geometry.coordinates.map(p => [p[1], p[0]]), color, real: true };
  } catch (e) {
    return { coords: [[o.lat, o.lng], [s.lat, s.lng]], color, real: false };
  }
}
async function drawRoutes(R, tok) {
  if (!hasMap) return;
  routeLayer.clearLayers();
  const o = R.origin, jobs = [];
  if (R.nearest) jobs.push(routeTo(o, R.nearest.store, '#2563eb'));
  if (R.cheapest && (!R.nearest || R.cheapest.store.id !== R.nearest.store.id)) jobs.push(routeTo(o, R.cheapest.store, '#16a34a'));
  const same = R.cheapest && R.nearest && R.cheapest.store.id === R.nearest.store.id;
  const lines = await Promise.all(jobs);
  if (tok !== suggestToken) return;
  const pts = [[o.lat, o.lng]];
  let fake = false;
  lines.forEach(l => {
    if (l.real) {
      L.polyline(l.coords, { color: '#fff', weight: 9, opacity: 0.85 }).addTo(routeLayer);
      L.polyline(l.coords, { color: l.color, weight: 5, opacity: 0.95 }).addTo(routeLayer);
      if (same) L.polyline(l.coords, { color: '#16a34a', weight: 2, opacity: 1 }).addTo(routeLayer);
    } else {
      fake = true;
      L.polyline(l.coords, { color: l.color, weight: 4, opacity: 0.9, dashArray: '8 8' }).addTo(routeLayer);
    }
    pts.push(...l.coords);
  });
  if (fake) toast('Không lấy được tuyến đường thật — đang hiện đường thẳng nét đứt', 'warn');
  if (pts.length > 1) map.flyToBounds(pts, { padding: [50, 50], maxZoom: 16, duration: 0.6 });
}

/* ================= Sự kiện (ủy quyền) ================= */
function ctx(el) {
  if (el.closest('#formView')) return S.editing ? { root: $('#formView'), d: S.editing.draft } : null;
  if (el.closest('#list') && S.tab === 'lookup') return { root: $('#list'), d: S.lookup };
  return null;
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const cx = ctx(t);

  if (t.classList.contains('tab')) { switchTab(t.dataset.tab); return; }
  if (t.id === 'btnImport') { S.tab === 'catalog' ? openPriceImport() : openImport(); return; }
  if (t.id === 'btnAdd') { S.tab === 'customers' ? openCustomerForm(null) : S.tab === 'catalog' ? openCatForm(null) : openStoreForm(null); return; }
  if (t.classList.contains('cat-main')) { openCatForm(t.dataset.cid); return; }
  if (t.classList.contains('mv-btn')) { moveCat(t.dataset.cid, +t.dataset.dir); return; }
  if (t.classList.contains('card')) {
    const id = t.dataset.id;
    if (t.dataset.kind === 'store') { if (isAdmin()) openStoreForm(id); else openDetail(id); }
    else openCustomerForm(id);
    return;
  }
  if (t.dataset.store) { focusStore(t.dataset.store); return; }
  if (t.classList.contains('btn-back')) { closeDetail(); return; }
  if (t.classList.contains('btn-cancel')) { closeForm(false); return; }
  if (t.classList.contains('btn-save')) { const k = S.editing.type; k === 'store' ? saveStore(t) : k === 'cat' ? saveCat(t) : k === 'import' ? saveImport(t) : k === 'pimport' ? piSave(t) : saveCustomer(t); return; }
  if (t.classList.contains('btn-delete')) { deleteCurrent(t); return; }
  if (!cx) return;
  const { root, d } = cx;

  if (S.editing && S.editing.type === 'pimport') { piClick(t, d, root); return; }
  if (t.classList.contains('pt-import')) {
    if (S.editing.dirty && !confirm('Cửa hàng đang có thay đổi chưa lưu. Bỏ thay đổi để nhập bảng giá từ file?')) return;
    const sid = S.editing.id; closeForm(true); openPriceImport(sid); return;
  }
  if (S.editing && S.editing.type === 'import') {
    const imp = d;
    if (t.classList.contains('pi-open')) { if (imp.paste && !confirm('Bỏ dữ liệu đang dán?')) return; closeForm(true); openPriceImport(); return; }
    if (t.classList.contains('imp-next1')) {
      if (Core.clean(imp.paste)) { imp.fname = ''; startMapping(imp, Core.parseDelimited(imp.paste)); }
      else toast('Chọn file hoặc dán bảng danh sách trước', 'warn');
    } else if (t.classList.contains('imp-sample')) downloadSample();
    else if (t.classList.contains('imp-back')) { impCleanup(imp); imp.step--; renderImport(); }
    else if (t.classList.contains('imp-go')) startReview(imp);
    else if (t.classList.contains('imp-stop')) { imp.stop = true; }
    else if (t.classList.contains('imp-resume')) runGeocode(imp);
    else if (t.closest('.imp-filter')) {
      imp.filter = t.dataset.f; $$('.imp-filter button', root).forEach(b => b.setAttribute('aria-pressed', String(b === t))); renderImpList();
    } else if (t.classList.contains('imp-place')) impStartPlace(imp, +t.dataset.i);
    else if (t.classList.contains('imp-main')) {
      const r = imp.rows[+t.dataset.i];
      if (r.lat != null) {
        goTo(r.lat, r.lng, 17);
        imp.markers.forEach(x => x.setZIndexOffset(0));
        const m = imp.markers.get(r); if (m) { m.setZIndexOffset(2000); setTimeout(() => m.openTooltip(), 400); }
      }
      else if (r.st !== 'pending' || !r.sel) impStartPlace(imp, +t.dataset.i);
    }
    return;
  }

  if (t.classList.contains('btn-drop')) dropPinCenter(d);
  else if (t.classList.contains('btn-me')) geolocate(d);
  else if (t.classList.contains('btn-geo')) doGeocode(d, t);
  else if (t.classList.contains('btn-suggest')) runSuggest(d, root, t);
  else if (t.classList.contains('c-add')) {
    d.items.push(emptyItem()); rerenderCart(root, d); markDirty(d);
    const rows = $$('.crow', root); rows[rows.length - 1].querySelector('select').focus();
  } else if (t.classList.contains('c-del')) {
    d.items.splice(+t.closest('.crow').dataset.i, 1);
    if (!d.items.length) d.items.push(emptyItem());
    rerenderCart(root, d); markDirty(d); invalidateResult(d);
  } else if (t.classList.contains('pg-head')) {
    const sec = t.closest('.pg'), g = sec.dataset.grp, open = !sec.classList.contains('open');
    if (open) d.open.add(g); else d.open.delete(g);
    sec.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open));
  } else if (t.classList.contains('np-open')) {
    const fromSearch = Core.clean(d.ptq);
    d.np = { grp: '', name: fromSearch, unit: '', spec: '' };
    root.querySelector('.np').outerHTML = newProdHTML(d);
    root.querySelector(fromSearch ? '.np-unit' : '.np-grp').focus();
  } else if (t.classList.contains('np-cancel')) {
    d.np = null; root.querySelector('.np').outerHTML = newProdHTML(d);
    root.querySelector('.np-open').focus();
  } else if (t.classList.contains('np-save')) {
    addNewProduct(root, d, t);
  }
});

let searchTimer = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'search') { S.search = t.value; clearTimeout(searchTimer); searchTimer = setTimeout(renderList, 120); return; }
  const cx = ctx(t); if (!cx) return;
  const { root, d } = cx;
  if (t.classList.contains('f-name')) { d.name = t.value; markDirty(d); }
  else if (t.classList.contains('f-phone')) { d.phone = t.value; markDirty(d); }
  else if (t.classList.contains('f-addr')) { d.address = t.value; markDirty(d); }
  else if (t.classList.contains('c-qty')) {
    const it = d.items[+t.closest('.crow').dataset.i];
    it.qtyText = t.value; it.qty = Core.parseQty(t.value);
    t.classList.toggle('invalid', Number.isNaN(it.qty) || it.qty === 0);
    markDirty(d); invalidateResult(d);
  } else if (t.classList.contains('imp-paste')) {
    d.paste = t.value; if (t.value.trim()) S.editing.dirty = true;
  } else if (t.classList.contains('pr-price')) {
    const row = t.closest('.pr'), cid = row.dataset.cid, v = Core.parsePrice(t.value);
    if (v == null) d.prices.delete(cid); else d.prices.set(cid, v);
    row.classList.toggle('on', v != null); row.classList.remove('err');
    refreshPtCounts(root, d); markDirty(d);
  } else if (t.classList.contains('pt-q')) {
    d.ptq = t.value; rerenderPt(root, d);
  } else if (t.classList.contains('np-grp') || t.classList.contains('np-name') || t.classList.contains('np-unit') || t.classList.contains('np-spec')) {
    d.np[t.className.match(/np-(grp|name|unit|spec)/)[1]] = t.value;
  } else if (/\bk-(grp|name|unit|spec)\b/.test(t.className)) {
    d[t.className.match(/\bk-(grp|name|unit|spec)\b/)[1]] = t.value; markDirty(d);
  }
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'prodFilter') { S.filterKey = t.value; renderList(); renderPins(); return; }
  const cx = ctx(t); if (!cx) return;
  const { root, d } = cx;
  if (t.classList.contains('snap-chk')) { d.snapOn = t.checked; if (!t.checked) setSnapNote(d, ''); else if (d.lat != null) snapToRoad(d); }
  else if (t.classList.contains('c-prod')) {
    const row = t.closest('.crow'), it = d.items[+row.dataset.i];
    const c = S.catMap.get(t.value);
    if (c) { it.key = c.key; it.name = c.name; it.unit = c.unit; }
    else if (!t.value) { it.key = ''; it.name = ''; it.unit = ''; }
    row.querySelector('.c-unit').textContent = it.unit;
    row.querySelector('.c-info').innerHTML = cartInfo(it);
    if (it.key && !it.qtyText) { it.qtyText = '1'; it.qty = 1; row.querySelector('.c-qty').value = '1'; }
    markDirty(d); invalidateResult(d);
  } else if (S.editing && S.editing.type === 'pimport' && /\bpi-/.test(t.className)) {
    piChange(t, d);
  } else if (t.classList.contains('imp-file')) {
    readImpFile(t.files && t.files[0]); t.value = '';
  } else if (t.classList.contains('imp-head')) {
    d.hasHead = t.checked; d.cols = Core.guessCols(d.hasHead ? d.raw[0] : null, impData(d)); renderImport();
  } else if (t.classList.contains('imp-col')) {
    d.cols[t.dataset.k] = +t.value; const k = t.dataset.k; renderImport(); const s2 = $('#formView .imp-col[data-k="' + k + '"]'); if (s2) s2.focus();
  } else if (t.classList.contains('imp-sel')) {
    const r = d.rows[+t.closest('.imp-row').dataset.i]; r.sel = t.checked;
    t.closest('.imp-row').classList.toggle('off', !r.sel); syncImpMarker(d, r);
    updateImpRow(d, r); renderImpSummary(); renderImpProgress();
    if (r.sel && r.st === 'pending' && !d.running) runGeocode(d);
  } else if (t.classList.contains('k-hidden')) {
    d.hidden = t.checked; markDirty(d);
  }
});

document.addEventListener('focusout', ev => {
  const t = ev.target;
  if (t.classList && t.classList.contains('pr-price')) {
    const v = Core.parsePrice(t.value); t.value = v == null ? '' : Core.digits(v);
  } else if (t.classList && t.classList.contains('c-qty')) {
    const v = Core.parseQty(t.value);
    if (v > 0) { t.value = Core.fmtQty(v); const cx = ctx(t); if (cx) cx.d.items[+t.closest('.crow').dataset.i].qtyText = t.value; }
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.editing && S.editing.type === 'import' && S.editing.draft.placing >= 0) {
    const imp = S.editing.draft, i = imp.placing; imp.placing = -1; updateImpRow(imp, imp.rows[i]); return;
  }
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('.np-form')) {
    ev.preventDefault();
    const b = ev.target.closest('.np-form').querySelector('.np-save'); if (b && !b.disabled) b.click();
    return;
  }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('pr-price')) {
    // Enter ở ô giá → nhảy xuống ô giá kế tiếp
    ev.preventDefault();
    const all = $$('#formView .pg.open .pr-price'), i = all.indexOf(ev.target);
    if (i >= 0 && all[i + 1]) all[i + 1].focus();
    return;
  }
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('f-addr')) {
    ev.preventDefault();
    const btn = ev.target.parentElement.querySelector('.btn-geo'); if (btn && !btn.disabled) btn.click();
  }
});

// Kéo thả file vào ô chọn file
document.addEventListener('dragover', ev => {
  const z = ev.target.closest && ev.target.closest('.dropzone'); if (!z) return;
  ev.preventDefault(); z.classList.add('over');
});
document.addEventListener('dragleave', ev => { const z = ev.target.closest && ev.target.closest('.dropzone'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', ev => {
  const z = ev.target.closest && ev.target.closest('.dropzone'); if (!z) return;
  ev.preventDefault(); z.classList.remove('over');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) readImpFile(f);
});

function switchTab(tab) {
  if (S.tab === tab) return;
  S.tab = tab; S.search = ''; $('#search').value = '';
  renderTabs(); renderList(); placeEditMarker();
  $('#list').scrollTop = 0;
}

window.addEventListener('hashchange', () => {
  const m = (location.hash || '').toLowerCase() === '#quanly' ? 'admin' : 'public';
  if (m !== S.mode) location.reload();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sb && Date.now() - S.lastLoad > 60000) loadData(true);
});

/* ================= Đăng nhập (chế độ quản lý) ================= */
let session = null;
function showLogin(msg) {
  const box = $('#login');
  box.hidden = false;
  $('#side').inert = true; $('#mapWrap').inert = true;
  const err = $('#loginErr');
  err.textContent = msg || ''; err.hidden = !msg;
  setTimeout(() => { const e = $('#loginEmail'); (e.value ? $('#loginPass') : e).focus(); }, 60);
}
function hideLogin() {
  $('#login').hidden = true;
  $('#side').inert = panelHidden; $('#mapWrap').inert = false;
}
function authMsg(e) {
  const m = (e && e.message) || String(e || '');
  if (/invalid login credentials/i.test(m)) return 'Email hoặc mật khẩu không đúng.';
  if (/email not confirmed/i.test(m)) return 'Tài khoản chưa xác nhận email. Vào Supabase → Authentication → Users để xác nhận.';
  if (/rate limit|too many/i.test(m)) return 'Thử quá nhiều lần — đợi một lát rồi đăng nhập lại.';
  if (/fetch|network|load failed/i.test(m)) return 'Lỗi mạng — kiểm tra internet rồi thử lại.';
  return 'Không đăng nhập được: ' + m;
}
async function doLogin(ev) {
  ev.preventDefault();
  const email = $('#loginEmail').value.trim(), pass = $('#loginPass').value;
  const err = $('#loginErr'), btn = $('#loginBtn');
  if (!email || !pass) { err.textContent = 'Nhập đủ email và mật khẩu.'; err.hidden = false; (!email ? $('#loginEmail') : $('#loginPass')).focus(); return; }
  if (!sb) return;
  btn.disabled = true; btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Đang đăng nhập…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    $('#loginPass').value = '';
    enterAdmin(data.session);
    toast('Xin chào ' + email, 'ok');
  } catch (e) {
    err.textContent = authMsg(e); err.hidden = false;
    $('#loginPass').select();
  } finally { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
}
function enterAdmin(sess) {
  session = sess;
  hideLogin();
  const email = sess && sess.user ? sess.user.email || '' : '';
  $('#modeText').textContent = 'Quản lý' + (email ? ' · ' + email : '');
  $('#modeText').title = email;
  $('#btnLogout').hidden = false;
  try { if (sb.realtime && sb.realtime.setAuth) sb.realtime.setAuth(sess.access_token); } catch (e) { /* bỏ qua */ }
  loadData();
  subscribe();
}
function clearAdminData() {
  loadSeq++;
  S.stores = []; S.customers = []; S.loaded = false;
  $('#btnLogout').hidden = true;
  $('#modeText').textContent = 'Quản lý cửa hàng & khách hàng'; $('#modeText').title = '';
  setSync('auth');
  if (routeLayer) routeLayer.clearLayers();
  renderAll();
}
async function logout() {
  if (S.editing && S.editing.dirty && !confirm('Đang có thay đổi chưa lưu. Vẫn đăng xuất?')) return;
  if (S.editing) closeForm(true);
  session = null;
  unsubscribe();
  try { await sb.auth.signOut(); } catch (e) { /* bỏ qua */ }
  clearAdminData();
  showLogin();
  toast('Đã đăng xuất', 'ok');
}
$('#loginForm').addEventListener('submit', doLogin);
$('#btnLogout').addEventListener('click', logout);
$('#pwToggle').addEventListener('click', () => {
  const i = $('#loginPass'), b = $('#pwToggle'), show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.classList.toggle('on', show);
  b.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
  i.focus();
});

/* ---------- Ẩn / hiện bảng để xem bản đồ toàn màn hình ---------- */
if (!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'))) {
  const fitH = () => { document.body.style.height = window.innerHeight + 'px'; };
  fitH(); window.addEventListener('resize', fitH);
}
let panelHidden = false;
function setPanel(show) {
  panelHidden = !show;
  document.body.classList.toggle('panel-off', !show);
  $('#side').inert = !show || !$('#login').hidden;
  const b = $('#panelToggle');
  b.setAttribute('aria-expanded', String(show));
  b.title = show ? 'Ẩn bảng — xem bản đồ toàn màn hình' : 'Hiện bảng danh sách';
  b.querySelector('.pt-label').textContent = show ? 'Ẩn bảng' : 'Hiện bảng';
  if (hasMap) setTimeout(() => map.invalidateSize(), 300);
}
$('#panelToggle').addEventListener('click', () => setPanel(panelHidden));
$('#panelHideM').addEventListener('click', () => { setPanel(false); $('#panelToggle').focus(); });
document.body.addEventListener('transitionend', e => {
  if (e.target === document.body && hasMap) map.invalidateSize();
});

/* ---------- Xóa ghim vị trí (bấm 1 lần lên bản đồ, trang xem) ---------- */
function clearLookupPin() {
  const d = S.lookup;
  if (isAdmin() || S.editing || d.lat == null) return;
  snapToken++;
  invalidateResult(d);
  d.lat = null; d.lng = null;
  removeEditMarker();
  updateLocUI(d); setSnapNote(d, '');
  toast('Đã xóa ghim vị trí — nhấp đúp lên bản đồ để ghim lại', 'ok');
}

/* ---------- Ghim vị trí từ bản đồ (nhấp đúp) ---------- */
function lookupAt(latlng) {
  if (isAdmin() || !$('#login').hidden) return;
  const wasHidden = panelHidden;
  if (S.detailId) closeDetail();
  if (S.tab !== 'lookup') switchTab('lookup');
  if (wasHidden) setPanel(true);
  const d = S.lookup;
  setDraftLocation(d, latlng.lat, latlng.lng);
  // Đợi bảng hiện xong rồi: cuộn tới "Danh sách cần mua", đặt con trỏ vào ô chọn sản phẩm còn trống,
  // và (trên điện thoại bản đồ thấp đi) lướt bản đồ tới chỗ vừa ghim nếu nó bị khuất
  setTimeout(() => {
    const list = $('#list');
    const sel = $$('#list .c-prod').find(x => !x.value) || $('#list .c-prod');
    if (sel) {
      const box = sel.closest('.cart-box') || sel;
      const top = list.scrollTop + box.getBoundingClientRect().top - list.getBoundingClientRect().top - 8;
      if (list.scrollTo) list.scrollTo({ top: Math.max(0, top), behavior: 'smooth' }); else list.scrollTop = Math.max(0, top);
      try { sel.focus({ preventScroll: true }); } catch (e) { /* bỏ qua */ }
    }
    if (d.lat != null) goTo(d.lat, d.lng);
  }, wasHidden ? 320 : 30);
  toast('Đã ghim vị trí của bạn — chọn sản phẩm cần mua', 'ok');
}

/* ---------- Rê chuột lên thẻ → làm nổi ghim tương ứng ---------- */
function markerOfCard(c) { return (c.dataset.kind === 'store' ? storeMarkers : custMarkers).get(c.dataset.id); }
document.addEventListener('mouseover', ev => {
  const c = ev.target.closest && ev.target.closest('#list .card');
  if (!c || !hasMap) return;
  const m = markerOfCard(c);
  if (m) { m.openTooltip(); const el = m.getElement(); if (el) el.classList.add('hot'); }
});
document.addEventListener('mouseout', ev => {
  const c = ev.target.closest && ev.target.closest('#list .card');
  if (!c || (ev.relatedTarget && c.contains(ev.relatedTarget)) || !hasMap) return;
  const m = markerOfCard(c);
  if (m) { m.closeTooltip(); const el = m.getElement(); if (el) el.classList.remove('hot'); }
});

/* ================= Khởi động ================= */
async function start() {
  $('#modeBadge').hidden = !isAdmin();
  $('#modeText').textContent = isAdmin() ? 'Quản lý cửa hàng & khách hàng' : 'Tìm cửa hàng vật tư gần & rẻ';
  initMap();
  renderAll();
  if (typeof supabase === 'undefined' || !supabase.createClient) {
    setSync('err');
    if (!hasMap) showNotice('Không tải được bản đồ và dữ liệu', 'Thư viện bản đồ (Leaflet) và dữ liệu (Supabase) đều chưa tải được. Kiểm tra kết nối internet, tắt trình chặn quảng cáo cho trang này rồi tải lại (F5).');
    else showNotice('Không tải được thư viện dữ liệu', 'Thư viện Supabase chưa tải được. Kiểm tra internet, tắt trình chặn quảng cáo cho trang này rồi tải lại (F5).');
    if (isAdmin()) { showLogin('Không tải được thư viện đăng nhập (Supabase). Kiểm tra internet rồi tải lại trang.'); $('#loginBtn').disabled = true; }
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bdvt-auth', detectSessionInUrl: false }
  });
  if (!isAdmin()) { loadData(); subscribe(); return; }

  setSync('auth');
  sb.auth.onAuthStateChange((event, sess) => {
    if (event === 'SIGNED_OUT' && session) {
      // Hết phiên ngoài ý muốn: giữ nguyên form đang sửa, chỉ yêu cầu đăng nhập lại
      session = null; unsubscribe(); clearAdminData();
      showLogin('Phiên đăng nhập đã kết thúc — hãy đăng nhập lại.');
    } else if (event === 'TOKEN_REFRESHED' && sess) {
      session = sess;
      try { if (sb.realtime && sb.realtime.setAuth) sb.realtime.setAuth(sess.access_token); } catch (e) { /* bỏ qua */ }
    }
  });
  let sess = null;
  try { const r = await sb.auth.getSession(); sess = r && r.data ? r.data.session : null; } catch (e) { /* bỏ qua */ }
  if (sess) enterAdmin(sess); else showLogin();
}

window.BDVT = { Core, S, _test: { getMap: () => map, openImport, openPriceImport, readImpFile, startMapping, logout, setPanel, renderAll, openStoreForm, openCustomerForm, runSuggest, closeForm, switchTab, loadData } };
start();
})();
</script>
